<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Meter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Timer Meter</h1>
    <div class="meter-container">
        <div id="meter"></div>
    </div>
    <p>Time Left: <span id="time-display">100</span> seconds</p>
    <div id="buttons-container">
        <button onclick="increaseTime(5)">+5s</button>
        <button onclick="increaseTime(10)">+10s</button>
        <button onclick="increaseTime(20)">+20s</button>
    </div>
    <div class="new-button-container">
        <input type="number" id="newTimeValue" placeholder="Enter time to add">
        <button onclick="addNewButton()">Add New Button</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
